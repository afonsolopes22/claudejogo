[project]
name = "jev-trader"
version = "0.1.0"
description = "24/7 autonomous crypto trading agent: Brain (Claude Opus) + Reflex (TypeSafe Jev) with a code-owned risk layer"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "typesafe-sdk>=0.7.5",
  "anthropic>=1.0",
  "httpx2>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_trader*"]

[tool.setuptools.package-data]
jev_trader = ["ui/static/*.html"]
