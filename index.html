<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1d14">
<title>Cue Legends</title>
<meta name="description" content="Cue Legends: sinuca de bolso com partidas, desafios, torneios e recompensas diárias.">
<meta name="apple-mobile-web-app-title" content="Cue Legends">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="logo" viewBox="13 13 74 74">
<linearGradient id="lgc" gradientUnits="userSpaceOnUse" x1="20" y1="80" x2="80" y2="20"><stop offset="0" stop-color="#3a210f"/><stop offset=".3" stop-color="#3a210f"/><stop offset=".31" stop-color="#ffcf3f"/><stop offset=".35" stop-color="#ffcf3f"/><stop offset=".36" stop-color="#e3b878"/><stop offset="1" stop-color="#f6e3b0"/></linearGradient>
<radialGradient id="lgb" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#6e6e6e"/><stop offset=".65" stop-color="#101010"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="lgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ffcf3f"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
<polygon points="22.3,82.3 81,21 79,19 17.7,77.7" fill="url(#lgc)"/>
<circle cx="80.4" cy="19.6" r="2.3" fill="#5ac8ff"/>
<circle cx="50" cy="52" r="26" fill="url(#lgb)" stroke="url(#lgr)" stroke-width="2.6"/>
<circle cx="50" cy="52" r="13" fill="#f6f6f2"/>
<polygon points="50.00,43.40 52.29,49.44 58.75,49.76 53.71,53.81 55.41,60.04 50.00,56.50 44.59,60.04 46.29,53.81 41.25,49.76 47.71,49.44" fill="#111"/>
<ellipse cx="41" cy="38.5" rx="7" ry="4" fill="#fff" opacity=".35" transform="rotate(-30 41 38.5)"/></symbol><radialGradient id="g8" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#6b6b6b"/><stop offset=".7" stop-color="#0b0b0b"/></radialGradient></defs>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 01-8 0V4z"/><path d="M8 6H5.5a3 3 0 002.8 4M16 6h2.5a3 3 0 01-2.8 4M12 13v4M9 20h6M10 17h4v3h-4z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A4.5 4.5 0 0120.5 19"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3.5h6V5M8.5 11h7M8.5 15h5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M3 7h18v3H3zM12 7v13M12 7C10 3 6.5 4 8 7M12 7c2-4 5.5-3 4 0"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.2v5.6l5-2.8z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 115 .8c0 1.6-2.5 2-2.5 3.6M12 17.3v.1"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
</svg>
<div id="app">
  <div id="hud">
    <div class="player" id="p0"><div class="pn"><span id="n0"></span><span class="grp" id="g0"></span></div><div class="dots" id="d0"></div></div>
    <div class="player" id="p1"><div class="pn"><span id="n1"></span><span class="grp" id="g1"></span></div><div class="dots" id="d1"></div></div>
    <div id="hudCoins"><svg class="ic"><use href="#i-coin"/></svg><span id="hudCoinN">0</span></div>
    <div id="hudBtns"><button id="menuBtn" data-i18n-aria="aria.pause"><svg class="ic"><use href="#i-pause"/></svg></button><button id="muteBtn" data-i18n-aria="aria.sound"><svg class="ic"><use href="#i-sound"/></svg></button></div>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv" role="img" data-i18n-aria="aria.table"></canvas>
      <div id="coach"><div id="coachTxt"></div><div id="coachBtns"><button id="coachSkip" class="alt" data-i18n="ui.skip"></button><button id="coachOk" data-i18n="ui.next"></button></div></div>
    </div>
    <div id="side">
      <div id="spin" class="disabled" role="img" data-i18n-aria="aria.spin"><i id="spinDot"></i></div>
      <div id="power" class="disabled" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="aria.power"><div id="powerFill"></div><i class="sug" id="powSug"></i><div id="powerText"></div></div>
      <div id="nudge"><button id="nL" class="alt" data-i18n-aria="aria.left">◀</button><button id="nR" class="alt" data-i18n-aria="aria.right">▶</button></div>
    </div>
  </div>
  <div id="banner" data-i18n="banner.ad"></div>
</div>

<div class="overlay show" id="menu">
  <div class="mL">
    <h1><svg class="logo8" viewBox="0 0 100 100" aria-hidden="true"><use href="#logo"/></svg><span data-i18n="app.name"></span></h1>
    <p id="lvlInfo"></p>
    <div class="mlinks"><a id="lnkPriv" href="privacy.html" data-i18n="menu.privacy"></a><button id="btnSettings" class="alt small" data-i18n="set.title"></button></div>
  </div>
  <div class="mR">
    <button id="btnCpu"><svg class="ic"><use href="#i-coin"/></svg> <span data-i18n="menu.play"></span></button>
    <button id="btnChal" class="alt"><svg class="ic"><use href="#i-target"/></svg> <span data-i18n="menu.chal"></span></button>
    <button id="btnTour" class="alt"><svg class="ic"><use href="#i-trophy"/></svg> <span data-i18n="menu.tour"></span></button>
    <button id="btnModes" class="alt"><svg class="ic"><use href="#i-users"/></svg> <span data-i18n="menu.modes"></span></button>
    <button id="btnProf" class="alt"><svg class="ic"><use href="#i-list"/></svg> <span data-i18n="menu.missions"></span></button>
    <button id="btnShop" class="alt"><svg class="ic"><use href="#i-cart"/></svg> <span data-i18n="menu.shop"></span></button>
    <button id="btnDaily" class="alt"><svg class="ic"><use href="#i-gift"/></svg> <span data-i18n="menu.daily"></span></button>
    <button id="btnChest" class="alt"><svg class="ic"><use href="#i-gift"/></svg> <span data-i18n="menu.chest"></span></button>
    <button id="btnVideo" class="alt"></button>
    <button id="btnTut" class="alt"><svg class="ic"><use href="#i-help"/></svg> <span data-i18n="menu.how"></span></button>
  </div>
</div>
<div class="overlay top" id="rooms"><button class="alt small back" data-close="rooms" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="rooms.title"></h1><div class="grid" id="roomList"></div></div></div>
<div class="overlay top" id="prof">
  <button class="alt small back" data-close="prof" data-i18n="ui.back"></button>
  <div class="ovc">
    <h1 data-i18n="prof.title"></h1>
    <div class="card" id="profInfo"></div>
    <div class="grid" id="missionList"></div>
    <button id="btnAch" class="small" data-i18n="prof.ach"></button>
    <button class="alt small fxbtn"></button>
  </div>
</div>
<div class="overlay top" id="modes"><button class="alt small back" data-close="modes" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="modes.title"></h1>
  <div class="mgrid">
    <button id="btnM2p" class="alt mcard"><b data-i18n="modes.p2"></b><small data-i18n="modes.p2d"></small></button>
    <button id="btnMTrain" class="alt mcard"><b data-i18n="modes.train"></b><small data-i18n="modes.traind"></small></button>
    <button id="btnMWeek" class="alt mcard"><b data-i18n="modes.week"></b><small id="weekSub"></small></button>
  </div></div></div>
<div class="overlay top" id="settings"><button class="alt small back" data-close="settings" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="set.title"></h1>
  <div class="setrow2"><span data-i18n="set.lang"></span><div class="seg" id="setLang"><button class="alt" data-lang="pt">Português</button><button class="alt" data-lang="en">English</button></div></div>
  <div class="setlist"><button id="setSound" class="alt"></button><button id="setVib" class="alt"></button><button id="setLefty" class="alt"></button><button class="alt fxbtn"></button><button id="setPriv" class="alt" hidden></button></div>
  <p class="hint" data-i18n="set.kb"></p></div></div>
<div class="overlay top" id="p2setup"><button id="p2back" class="alt small back" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="p2.title"></h1>
  <div class="p2row"><label for="p2n0" data-i18n="p2.name1"></label><input id="p2n0" maxlength="12" autocomplete="off" spellcheck="false"></div>
  <div class="p2row"><label for="p2n1" data-i18n="p2.name2"></label><input id="p2n1" maxlength="12" autocomplete="off" spellcheck="false"></div>
  <div class="seg" id="p2len"><button class="alt" data-len="1" data-i18n="p2.bo1"></button><button class="alt" data-len="3" data-i18n="p2.bo3"></button><button class="alt" data-len="5" data-i18n="p2.bo5"></button></div>
  <p id="p2stat"></p>
  <button id="btnP2go" data-i18n="p2.start"></button></div></div>
<div id="rpBar"><button id="rpClose" class="alt small" data-i18n="rp.close"></button><button id="rpSlow" class="alt small" data-i18n="rp.slow"></button><button id="rpGif" class="small" data-i18n="rp.gif"></button><span id="rpMsg"></span></div>
<div class="overlay" id="offer"><div class="ovc"><h1 data-i18n="offer.title"></h1><p data-i18n="offer.sub"></p>
  <div class="card shopc" id="offerCard" style="--rc:#ffb02e"><div class="t"><span class="tag" style="color:#ffb02e" data-i18n="offer.tag"></span><b data-i18n="offer.coins"></b><small id="offerItems"></small></div></div>
  <div class="btnrow"><button id="btnOfferBuy"><span class="oldprice">2,99 €</span>0,99 €</button><button class="alt small" id="btnOfferNo" data-i18n="offer.no"></button></div></div></div>
<div class="overlay" id="chest"><button class="alt small back" data-close="chest" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="chest.title"></h1><div id="chestBox"><svg class="ic"><use href="#i-gift"/></svg></div><p id="chestMsg"></p><div id="chestPrize"></div>
  <button id="btnChestOpen" data-i18n="chest.open"></button></div></div>
<div class="overlay" id="daily"><button class="alt small back" data-close="daily" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="daily.title"></h1><p id="dailyMsg"></p><div class="dgrid" id="dailyGrid"></div><button id="btnClaim"></button></div></div>
<div class="overlay top" id="ach"><button class="alt small back" id="achBack" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="ach.title"></h1><p id="achSum"></p><div class="grid" id="achList"></div></div></div>
<div class="overlay top" id="chal"><button class="alt small back" data-close="chal" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="chal.title"></h1><p id="chalSum"></p><div class="cgrid" id="chalGrid"></div></div></div>
<div class="overlay top" id="tour"><button class="alt small back" data-close="tour" data-i18n="ui.back"></button><div class="ovc"><h1 data-i18n="tour.title"></h1><p id="tourMsg"></p><div class="grid" id="tourList"></div><button id="btnTourGo"></button></div></div>
<div class="overlay top" id="shop">
  <button class="alt small back" data-close="shop" data-i18n="ui.back"></button>
  <div class="ovc">
    <h1 data-i18n="shop.title"></h1>
    <div class="tabs" id="shopTabs"><button data-t="cues" class="on" data-i18n="shop.cues"></button><button data-t="cloth" data-i18n="shop.cloths"></button><button data-t="tables" data-i18n="shop.tables"></button><button data-t="coins" data-i18n="shop.coins"></button></div>
    <div class="grid" id="shopList"></div>
  </div>
</div>
<div class="overlay" id="pause">
  <div class="ovc">
    <h1 data-i18n="pause.title"></h1>
    <p id="pauseMsg"></p>
    <div class="btnrow"><button id="btnResume" data-i18n="ui.resume"></button><button id="btnQuit" class="alt" data-i18n="pause.quit"></button></div>
    <div class="btnrow"><button id="btnReplay" class="alt small" data-i18n="rp.view"></button><button id="btnHeat" class="alt small" style="display:none"></button></div>
    <button class="alt small fxbtn"></button>
  </div>
</div>
<div class="overlay" id="over">
  <div class="ovc">
    <h1 id="overTitle"></h1>
    <div id="prizeCnt"></div>
    <p id="overMsg"></p>
    <div class="btnrow">
      <button id="btnDouble" data-i18n="over.double"></button>
      <button id="btnRetryAd" style="display:none" data-i18n="over.retry"></button>
      <button id="btnOverReplay" class="alt small" style="display:none" data-i18n="rp.view"></button>
      <button id="btnAgain"></button>
      <button id="btnMenu" class="alt"></button>
    </div>
  </div>
</div>
<div class="overlay" id="adov"><div class="ovc"><h2 data-i18n="ad.title"></h2><p id="adTxt"></p><button id="adClose" class="alt small" disabled data-i18n="ui.close"></button></div></div>
<div class="coins" id="coins"><svg class="ic"><use href="#i-coin"/></svg><span id="coinN">0</span></div>
<div id="achToast"></div>
<canvas id="fx"></canvas>
<div id="splash"><div id="lgBall"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#logo"/></svg></div><div id="lgTitle"></div><div id="lgSub" data-i18n="app.tag"></div></div>
<div id="rotate"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="48" rx="5"/><path d="M28 13h8"/><circle cx="32" cy="50" r="1.5"/></svg><b data-i18n="rotate.title"></b><span data-i18n="rotate.sub"></span></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/game.js"></script>
<script src="js/physics.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/modes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
